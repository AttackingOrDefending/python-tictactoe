# Builds the documentation on every push and pull request, and publishes it to GitHub Pages on pushes to main.
# Publishing needs Settings > Pages > Source to be set to "GitHub Actions".

name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install . --group docs
    - name: Build
      run: sphinx-build -W --keep-going -b html docs docs/_build/html
    - name: Upload
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_build/html

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
