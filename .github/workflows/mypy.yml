name: Mypy
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Mypy
    steps:
    - uses: actions/checkout@v7
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install . --group lint
    - name: Mypy
      run: mypy
